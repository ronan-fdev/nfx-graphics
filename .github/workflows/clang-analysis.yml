name: clang-analysis

on:
  push:
    branches: [ "main", "ci/**", "feat/**", "test/**", "fix/**" ]
  pull_request:
    branches: [ "main", "ci/**", "feat/**", "test/**", "fix/**" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clang-tidy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            clang clang-tidy clang-tools \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev

      - name: Configure (clang-tidy)
        run: |
          cmake -S . -B build-clang-tidy -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_CLANG_TIDY=clang-tidy \
            -DNFX_GRAPHICS_BUILD_TESTS=OFF \
            -DNFX_GRAPHICS_BUILD_SAMPLES=ON \
            -DNFX_GRAPHICS_WARNINGS_AS_ERRORS=ON

      - name: Build (runs clang-tidy)
        run: cmake --build build-clang-tidy --parallel

  scan-build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            clang clang-tools \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev

      - name: Configure (scan-build)
        run: |
          cmake -S . -B build-clang-lazy -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DNFX_GRAPHICS_BUILD_TESTS=OFF \
            -DNFX_GRAPHICS_BUILD_SAMPLES=ON \
            -DNFX_GRAPHICS_WARNINGS_AS_ERRORS=ON

      - name: Run scan-build (lazy)
        run: scan-build --status-bugs cmake --build build-clang-lazy --parallel
